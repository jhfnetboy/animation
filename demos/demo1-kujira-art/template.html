<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sea of Mind · From Word Stardust to the Whale of Emergence (AI Hand-Painted Film)</title>
<link rel="icon" href="data:,">
<style>
  :root { --accent: #5ad2f4; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0a0d16; color: #f0f2f8;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Thonburi", "Sukhumvit Set", "Noto Sans Thai", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden; user-select: none;
  }
  #stage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, #162038 0%, #090c14 100%);
  }
  #frame {
    position: relative; aspect-ratio: 16 / 9;
    width: min(100vw, calc(100vh * 16 / 9));
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.72);
    overflow: hidden;
  }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Center Hero Play Button */
  #big-wrap {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    transition: opacity .28s ease, transform .28s ease; z-index: 20;
  }
  #big {
    width: 84px; height: 84px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.35);
    background: rgba(14, 20, 38, 0.64); color: #fff; font-size: 30px; padding-left: 6px;
    cursor: pointer; backdrop-filter: blur(10px);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: transform .18s ease, background .18s ease;
  }
  #big:hover { transform: scale(1.06); background: rgba(20, 30, 56, 0.82); }
  .big-hint {
    padding: 5px 14px; border-radius: 999px; font-size: 12px; letter-spacing: 0.03em;
    background: rgba(12, 16, 30, 0.65); color: #dbe6ff; border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(8px); pointer-events: none;
  }
  body.playing #big-wrap { opacity: 0; pointer-events: none; transform: translate(-50%, -48%) scale(0.95); }

  /* Top-Left Teaching Metaphor Card */
  #caption-card {
    position: absolute; left: 20px; top: 18px; max-width: 390px; z-index: 15;
    padding: 13px 16px; border-radius: 14px;
    background: rgba(12, 17, 30, 0.62); backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-left: 3.5px solid var(--accent);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    transition: opacity .25s ease, transform .25s ease, border-color .35s ease;
  }
  body.no-captions #caption-card { opacity: 0; pointer-events: none; transform: translateY(-8px); }
  #cap-badge {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--accent);
    margin-bottom: 4px; text-transform: uppercase;
  }
  .cap-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  #cap-title { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: 0.02em; }
  #cap-en { font-size: 11.5px; color: rgba(215, 226, 248, 0.78); font-weight: 500; }
  #cap-desc { margin: 0; font-size: 12.5px; line-height: 1.55; color: rgba(238, 242, 252, 0.92); }

  /* Top-Right Title Watermark */
  #brand-tag {
    position: absolute; right: 20px; top: 18px; z-index: 15;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(12, 17, 30, 0.50); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 12px; color: rgba(235, 242, 255, 0.85); letter-spacing: 0.04em;
    pointer-events: none;
  }

  /* Bottom Floating Glass Control Bar */
  #ui {
    position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 25;
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 14px; border-radius: 16px;
    background: rgba(13, 17, 30, 0.72); backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
  }
  .ui-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  #acts { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .act-pill {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px 7px; border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05); color: #cbd5ec;
    cursor: pointer; font-size: 12px; white-space: nowrap; transition: all .18s ease;
  }
  .act-pill:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
  .act-pill.active {
    background: rgba(255, 255, 255, 0.14); color: #fff; font-weight: 600;
    border-color: var(--accent); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .act-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; font-size: 10.5px; font-weight: 700;
    background: rgba(255, 255, 255, 0.12); color: #fff;
  }
  .act-pill.active .act-num { background: var(--accent); color: #0a0f1d; }
  .act-prog {
    position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px;
    background: rgba(255, 255, 255, 0.08);
  }
  .act-prog i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .06s linear; }

  .ui-toggles { display: flex; align-items: center; gap: 6px; }
  .lang-switch {
    display: inline-flex; align-items: center; gap: 2px;
    height: 28px; padding: 2px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.05);
  }
  .lang-btn {
    height: 22px; padding: 0 7px; border: none; border-radius: 6px;
    background: transparent; color: #b8c4e0;
    cursor: pointer; font-size: 11.5px; font-weight: 500;
    transition: background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .lang-btn:hover { background: rgba(255, 255, 255, 0.10); color: #fff; }
  .lang-btn.active {
    background: rgba(90, 210, 244, 0.24); color: #fff; font-weight: 700;
    box-shadow: 0 0 0 1px rgba(90, 210, 244, 0.50) inset;
  }
  .tbtn {
    height: 28px; padding: 0 10px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.07); color: #dce4f5;
    cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;
    transition: background .15s ease;
  }
  .tbtn:hover { background: rgba(255, 255, 255, 0.15); }
  .tbtn.off { opacity: 0.55; }
  .tbtn.low { border-color: #fbbf24; color: #fde68a; }

  .ui-bottom { display: flex; align-items: center; gap: 10px; }
  #play {
    width: 34px; height: 28px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(90, 210, 244, 0.18); color: #fff; cursor: pointer; font-size: 12px;
  }
  #play:hover { background: rgba(90, 210, 244, 0.34); }
  #scrub { flex: 1; accent-color: #5ad2f4; cursor: pointer; height: 4px; }
  #lbl { min-width: 82px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: #c4cde4; }
  .loop-lbl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #b8c2dc; cursor: pointer; }
  .loop-lbl input { accent-color: #5ad2f4; cursor: pointer; }

  /* Headless capture mode */
  body.headless #ui, body.headless #big-wrap, body.headless #caption-card, body.headless #brand-tag { display: none; }
  body.headless #frame { width: 100vw; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="c"></canvas>

    <div id="caption-card">
      <div id="cap-badge">ACT 01 / 05</div>
      <div class="cap-head">
        <span id="cap-title">Token Raindrops</span>
        <span id="cap-en">Tokenization · Text Splitting</span>
      </div>
      <p id="cap-desc"></p>
    </div>

    <div id="brand-tag">The Sea of Mind · AI Odyssey</div>

    <div id="big-wrap">
      <button id="big" title="Play from start (Space)">▶</button>
      <div class="big-hint">Click to start the AI Odyssey (with real-time synthesized music · 16s)</div>
    </div>

    <div id="ui">
      <div class="ui-top">
        <div id="acts"></div>
        <div class="ui-toggles">
          <div class="lang-switch" role="group" aria-label="Language">
            <button class="lang-btn active" data-lang="en" type="button">EN</button>
            <button class="lang-btn" data-lang="zh" type="button">中文</button>
            <button class="lang-btn" data-lang="th" type="button">ไทย</button>
          </div>
          <button class="tbtn" id="cap-toggle" title="Show/Hide Teaching Captions (C)">📖 Captions</button>
          <button class="tbtn" id="mute" title="Mute / Unmute Audio (M)">🔊</button>
          <button class="tbtn" id="qual-toggle" title="Switch Render Resolution">HD 1080p</button>
        </div>
      </div>
      <div class="ui-bottom">
        <button id="play" title="Play / Pause (Space)">▶</button>
        <input id="scrub" type="range" min="0" max="383" value="0" title="Drag or use ← → to step frame by frame">
        <span id="lbl">0.00 / 16s</span>
        <label class="loop-lbl"><input id="loop" type="checkbox" checked><span id="loop-text">Loop</span></label>
      </div>
    </div>
  </div>
</div>

<script type="text/plain" id="three-src">%%THREE%%</script>

</script>
</body>
</html>
