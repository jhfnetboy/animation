<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Science Micro-Course Studio · Motion Canvas Timeline System</title>
  <style>
    :root {
      --bg-deep: #070b14;
      --bg-panel: #0d1424;
      --bg-card: #131c31;
      --bg-elevated: #19243e;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --border-glow: rgba(56, 189, 248, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-gold: #fbbf24;
      --accent-pink: #f472b6;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --font-sans: 'Inter', 'Noto Sans Thai', 'Sukhumvit Set', 'Thonburi', 'Leelawadee UI', 'Tahoma', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-sans);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 整体纵向应用壳层 */
    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.08), transparent 40%),
        radial-gradient(circle at 82% 88%, rgba(129, 140, 248, 0.08), transparent 42%),
        var(--bg-deep);
    }

    /* 顶部导航栏 */
    .topbar {
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(13, 20, 36, 0.92);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(12px);
      gap: 12px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .brand-badge {
      font-size: 11px;
      color: var(--accent-green);
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    /* 课程切换 Tab 组 */
    .lesson-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(7, 11, 20, 0.7);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      overflow-x: auto;
    }

    .lesson-tab {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 6px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: var(--font-sans);
    }

    .lesson-tab:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .lesson-tab.active {
      color: #fff;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(99, 102, 241, 0.28));
      border: 1px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.16);
    }

    /* 右侧语言切换、模式开关与全屏按钮 */
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      background: rgba(7, 11, 20, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.32);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.12);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 4px 9px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: var(--font-sans);
      white-space: nowrap;
      line-height: 1.3;
    }

    .lang-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.07);
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .lang-sep {
      width: 1px;
      height: 12px;
      background: rgba(148, 163, 184, 0.25);
      pointer-events: none;
    }

    .mode-switch {
      display: inline-flex;
      background: rgba(7, 11, 20, 0.78);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-sans);
    }

    .mode-btn.active {
      background: var(--accent-cyan);
      color: #04111d;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .icon-btn {
      border: 1px solid var(--border-subtle);
      background: rgba(25, 36, 62, 0.75);
      color: var(--text-primary);
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.18s ease;
      font-family: var(--font-sans);
    }

    .icon-btn:hover {
      border-color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.15);
    }

    /* 中间舞台主容器 */
    .stage-wrapper {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ==================== Slidev 风格 PPT 讲义模式 ==================== */
    .ppt-view {
      position: absolute;
      inset: 0;
      padding: 26px 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.99);
      transition: opacity 0.32s ease, transform 0.32s ease;
      z-index: 5;
    }

    .ppt-view.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .ppt-slide-card {
      width: 100%;
      max-width: 1120px;
      min-height: 490px;
      background: linear-gradient(155deg, rgba(19, 28, 49, 0.96), rgba(11, 17, 32, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      padding: 34px 40px;
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      position: relative;
      overflow: hidden;
    }

    .ppt-slide-card::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -120px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.14), transparent 70%);
      pointer-events: none;
    }

    .ppt-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .ppt-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .ppt-title {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text-primary);
    }

    .ppt-subtitle {
      margin-top: 8px;
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .ppt-page-indicator {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(7, 11, 20, 0.65);
      border: 1px solid var(--border-subtle);
      padding: 5px 11px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .ppt-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: stretch;
    }

    .ppt-box {
      background: rgba(7, 11, 20, 0.55);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ppt-box-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ppt-points {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .ppt-points li {
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
      padding-left: 18px;
      position: relative;
    }

    .ppt-points li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .ppt-metaphor-box {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.68), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(129, 140, 248, 0.35);
      border-radius: 16px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .metaphor-emoji {
      font-size: 38px;
      line-height: 1;
    }

    .metaphor-headline {
      font-size: 17px;
      font-weight: 700;
      color: #e0e7ff;
    }

    .metaphor-desc {
      font-size: 14px;
      line-height: 1.65;
      color: #cbd5e1;
    }

    .metaphor-formula {
      background: rgba(7, 11, 20, 0.85);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent-cyan);
      text-align: center;
    }

    .ppt-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 6px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
    }

    .ppt-slide-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cta-animate-btn {
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
      padding: 11px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.32);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      font-family: var(--font-sans);
    }

    .cta-animate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(56, 189, 248, 0.45);
    }

    /* ==================== 程序化时间轴动画舞台 ==================== */
    .canvas-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.985);
      transition: opacity 0.32s ease, transform 0.32s ease;
      z-index: 4;
    }

    .canvas-view.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* 舞台顶部悬浮 Step 导航胶囊 */
    .stage-hud {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }

    .step-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: auto;
      background: rgba(7, 11, 20, 0.72);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
      padding: 5px;
      border-radius: 12px;
    }

    .step-pill {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: var(--font-sans);
    }

    .step-pill:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
    }

    .step-pill.active {
      background: rgba(56, 189, 248, 0.22);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.45);
    }

    .canvas-stage-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #animCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ==================== 底部 Motion Canvas 风格控制台 ==================== */
    .timeline-dock {
      flex-shrink: 0;
      background: rgba(13, 20, 36, 0.96);
      border-top: 1px solid var(--border-subtle);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }

    .transport-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      height: 34px;
      padding: 0 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.16s ease;
      font-family: var(--font-sans);
    }

    .ctrl-btn:hover {
      border-color: var(--accent-cyan);
      background: var(--bg-elevated);
    }

    .ctrl-btn.primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-color: transparent;
      color: #fff;
      min-width: 82px;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
    }

    /* 时间轴轨道 */
    .scrubber-wrap {
      flex: 1;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .scrubber-track-area {
      position: relative;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .scrubber-rail {
      position: relative;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      overflow: visible;
    }

    .scrubber-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-indigo));
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.45);
      pointer-events: none;
    }

    .scrubber-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent-cyan);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
      pointer-events: none;
    }

    .keyframe-diamond {
      position: absolute;
      top: 50%;
      width: 9px;
      height: 9px;
      background: var(--accent-gold);
      border: 1px solid #070b14;
      transform: translate(-50%, -50%) rotate(45deg);
      pointer-events: none;
      opacity: 0.9;
    }

    .scrubber-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }

    .speed-group {
      display: inline-flex;
      background: rgba(7, 11, 20, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      flex-shrink: 0;
    }

    .speed-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      cursor: pointer;
    }

    .speed-btn.active {
      background: rgba(129, 140, 248, 0.25);
      color: #e0e7ff;
    }

    /* ==================== 教师演讲提词器抽屉 ==================== */
    .notes-drawer {
      flex-shrink: 0;
      background: #090e1a;
      border-top: 1px solid var(--border-subtle);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.28s ease;
    }

    .notes-drawer.open {
      max-height: 156px;
    }

    .notes-inner {
      padding: 12px 22px 14px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 18px;
      align-items: start;
    }

    .notes-badge-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .notes-heading {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notes-step-tag {
      font-size: 12px;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 4px 9px;
      border-radius: 7px;
      width: fit-content;
    }

    .notes-content {
      font-size: 13.5px;
      line-height: 1.68;
      color: #e2e8f0;
      overflow-y: auto;
      max-height: 120px;
      padding-right: 8px;
    }

    .notes-tip {
      margin-top: 6px;
      font-size: 12px;
      color: var(--accent-green);
    }

    @media (max-width: 1220px) {
      .brand-badge { display: none; }
      .lesson-tab { padding: 6px 10px; font-size: 12px; }
    }

    @media (max-width: 960px) {
      .topbar { height: auto; flex-wrap: wrap; padding: 8px 14px; }
      .ppt-grid { grid-template-columns: 1fr; }
      .notes-inner { grid-template-columns: 1fr; gap: 8px; }
      .timeline-dock { flex-wrap: wrap; gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">MC</div>
        <span class="brand-title" id="brandTitle">AI Micro-Course Studio</span>
        <span class="brand-badge" id="brandBadge"><span class="brand-dot"></span><span id="brandBadgeText">60fps Engine</span></span>
      </div>

      <nav class="lesson-tabs" id="lessonTabs" aria-label="Lesson Navigation">
        <button class="lesson-tab active" data-lesson="0">L1 · Tokenizer &amp; Vectors</button>
        <button class="lesson-tab" data-lesson="1">L2 · Self-Attention</button>
        <button class="lesson-tab" data-lesson="2">L3 · AI Agent</button>
      </nav>

      <div class="topbar-actions">
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Language Switch">
          <button class="lang-btn active" data-lang="en">EN</button>
          <span class="lang-sep" aria-hidden="true"></span>
          <button class="lang-btn" data-lang="zh">中文</button>
          <span class="lang-sep" aria-hidden="true"></span>
          <button class="lang-btn" data-lang="th">ไทย</button>
        </div>
        <div class="mode-switch" id="modeSwitch" role="group" aria-label="Presentation Mode">
          <button class="mode-btn active" id="btnModePpt" data-mode="ppt">Slides PPT</button>
          <button class="mode-btn" id="btnModeAnim" data-mode="anim">Animation</button>
        </div>
        <button class="icon-btn" id="btnFullscreen" title="Fullscreen Presentation">⛶ Fullscreen</button>
      </div>
    </header>

    <!-- 主舞台 -->
    <main class="stage-wrapper">
      <!-- Slidev 风格讲义模式 -->

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. 程序化补间、缓动与物理弹簧引擎 (致敬 Motion Canvas 数学核心)
      // =========================================================================
      const MathUtils = {
        clamp01(v) {
          return v < 0 ? 0 : v > 1 ? 1 : v;
        },
        lerp(a, b, t) {
          return a + (b - a) * t;
        },
        /** 局部时间片段映射：[start, end] -> [0, 1] */
        segment(time, start, end, easeFn) {
          if (end <= start) return time >= end ? 1 : 0;
          const raw = MathUtils.clamp01((time - start) / (end - start));
          return easeFn ? easeFn(raw) : raw;
        },
        linear(t) {
          return t;
        },
        easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        },
        easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        },
        easeOutBack(t) {
          const c1 = 1.70158;
          const c3 = c1 + 1;
          return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        },
        /** 欠阻尼二阶弹簧物理模拟：在 0->1 内输出带真实弹跳的超调曲线 */
        spring(t, stiffness = 210, damping = 16) {
          const p = MathUtils.clamp01(t);
          if (p === 0) return 0;
          if (p === 1) return 1;
          const omega = Math.sqrt(stiffness);
          const zeta = damping / (2 * omega);
          const timeScale = p * 1.4;
          if (zeta < 1) {
            const wd = omega * Math.sqrt(1 - zeta * zeta);
            return (
              1 -
              Math.exp(-zeta * omega * timeScale) *
                (Math.cos(wd * timeScale) +
                  ((zeta * omega) / wd) * Math.sin(wd * timeScale))
            );
          }
          return 1 - Math.exp(-omega * timeScale) * (1 + omega * timeScale);
        },
      };

      // =========================================================================
      // 2. Canvas 2D 高清矢量绘制工具集 (逻辑分辨率 1280 x 720)
      // =========================================================================
      const STAGE_W = 1280;
      const STAGE_H = 720;
      const FONT_SANS = "'Inter', 'Noto Sans Thai', 'Sukhumvit Set', 'Thonburi', 'Leelawadee UI', 'Tahoma', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif";
      const FONT_MONO = "'JetBrains Mono', 'SF Mono', ui-monospace, monospace";

      const Draw = {
        measureWidth(ctx, text) {
          if (!ctx.measureText) return String(text).length * 10;
          const m = ctx.measureText(text);
          return m && typeof m.width === 'number' && !Number.isNaN(m.width) ? m.width : 0;
        },

        fitFont(ctx, text, maxW, baseSize, minSize = 11, weight = '700', family = FONT_SANS) {
          let size = baseSize;
          ctx.font = `${weight} ${size}px ${family}`;
          if (maxW > 0) {
            while (size > minSize && Draw.measureWidth(ctx, text) > maxW) {
              size -= 1;
              ctx.font = `${weight} ${size}px ${family}`;
            }
          }
          return size;
        },

        roundRectPath(ctx, x, y, w, h, r) {
          const radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        },

        drawGridBg(ctx) {
          ctx.fillStyle = '#070B14';
          ctx.fillRect(0, 0, STAGE_W, STAGE_H);

          // 居中柔光
          const grad = ctx.createRadialGradient(STAGE_W / 2, STAGE_H / 2, 40, STAGE_W / 2, STAGE_H / 2, 620);
          grad.addColorStop(0, 'rgba(56, 189, 248, 0.08)');
          grad.addColorStop(1, 'rgba(7, 11, 20, 0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, STAGE_W, STAGE_H);

          // 科技网格线
          ctx.strokeStyle = 'rgba(30, 41, 59, 0.55)';
          ctx.lineWidth = 1;
          const step = 40;
          ctx.beginPath();
          for (let x = 0; x <= STAGE_W; x += step) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, STAGE_H);
          }
          for (let y = 0; y <= STAGE_H; y += step) {
            ctx.moveTo(0, y);
            ctx.lineTo(STAGE_W, y);
          }
          ctx.stroke();
        },

        drawStageHeader(ctx, title, badgeText, badgeColor) {
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          Draw.fitFont(ctx, title, STAGE_W - 80, 27, 18, '700', FONT_SANS);
          ctx.fillStyle = '#F8FAFC';
          ctx.fillText(title, STAGE_W / 2, 66);

          Draw.fitFont(ctx, badgeText, STAGE_W - 140, 15, 12, '600', FONT_SANS);
          const textW = Math.min(STAGE_W - 60, Draw.measureWidth(ctx, badgeText) + 40);
          Draw.roundRectPath(ctx, STAGE_W / 2 - textW / 2, 92, textW, 30, 15);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fill();
          ctx.strokeStyle = badgeColor;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = badgeColor;
          ctx.fillText(badgeText, STAGE_W / 2, 107);
          ctx.restore();
        },

        drawCard(ctx, cx, cy, w, h, opts = {}) {
          const {
            fill = '#111827',
            stroke = '#334155',
            lineWidth = 2,
            radius = 16,
            glow = 0,
            alpha = 1,
            scale = 1,
          } = opts;
          if (alpha <= 0.01 || scale <= 0.01) return;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(cx, cy);
          ctx.scale(scale, scale);
          if (glow > 0) {
            ctx.shadowColor = stroke;
            ctx.shadowBlur = glow;
          }
          Draw.roundRectPath(ctx, -w / 2, -h / 2, w, h, radius);
          ctx.fillStyle = fill;
          ctx.fill();
          ctx.shadowBlur = 0;
          if (lineWidth > 0) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
          ctx.restore();
        },

        drawArrow(ctx, x1, y1, x2, y2, progress, opts = {}) {
          const p = MathUtils.clamp01(progress);
          if (p <= 0.01) return;
          const {
            color = '#FBBF24',
            lineWidth = 4,
            dash = null,
            headSize = 12,
            label = '',
            labelOffset = {x: 0, y: -16},
            glow = 12,
          } = opts;

          const curX = MathUtils.lerp(x1, x2, p);
          const curY = MathUtils.lerp(y1, y2, p);
          const angle = Math.atan2(y2 - y1, x2 - x1);

          ctx.save();
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineWidth = lineWidth;
          ctx.lineCap = 'round';
          if (glow > 0) {
            ctx.shadowColor = color;
            ctx.shadowBlur = glow;
          }
          if (dash) ctx.setLineDash(dash);

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(curX, curY);
          ctx.stroke();

          ctx.setLineDash([]);
          if (p > 0.15) {
            ctx.beginPath();
            ctx.moveTo(curX, curY);
            ctx.lineTo(
              curX - headSize * Math.cos(angle - Math.PI / 6),
              curY - headSize * Math.sin(angle - Math.PI / 6)
            );
            ctx.lineTo(
              curX - headSize * Math.cos(angle + Math.PI / 6),
              curY - headSize * Math.sin(angle + Math.PI / 6)
            );
            ctx.closePath();
            ctx.fill();
          }

          if (label && p > 0.45) {
            ctx.shadowBlur = 0;
            ctx.globalAlpha = MathUtils.segment(p, 0.45, 0.9);
            ctx.font = `700 16px ${FONT_SANS}`;
            ctx.textAlign = 'center';
            ctx.fillText(label, (x1 + curX) / 2 + labelOffset.x, (y1 + curY) / 2 + labelOffset.y);
          }
          ctx.restore();
        },

        cubicPoint(p0, p1, p2, p3, t) {
          const u = 1 - t;
          const tt = t * t;
          const uu = u * u;
          const uuu = uu * u;
          const ttt = tt * t;
          return {
            x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
            y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y,
          };
        },

        /** 绘制带流光粒子的三阶贝塞尔光束 */
        drawAttentionBeam(ctx, p0, p1, p2, p3, progress, opts = {}) {
          const p = MathUtils.clamp01(progress);
          if (p <= 0.01) return;
          const {
            color = '#FBBF24',
            lineWidth = 8,
            alpha = 1,
            time = 0,
            showParticles = true,
          } = opts;

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = color;
          ctx.lineWidth = lineWidth;
          ctx.lineCap = 'round';
          ctx.shadowColor = color;
          ctx.shadowBlur = lineWidth * 2.2;

          const steps = 48;
          const maxIdx = Math.max(1, Math.floor(steps * p));
          ctx.beginPath();
          for (let i = 0; i <= maxIdx; i++) {
            const pt = Draw.cubicPoint(p0, p1, p2, p3, i / steps);
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();

          // 沿光束流动的能量光点
          if (showParticles && p > 0.5) {
            ctx.fillStyle = '#FFFFFF';
            ctx.shadowColor = '#FFFFFF';
            ctx.shadowBlur = 10;
            for (let k = 0; k < 3; k++) {
              const ptNorm = ((time * 0.65 + k * 0.33) % 1) * p;
              const orb = Draw.cubicPoint(p0, p1, p2, p3, ptNorm);
              ctx.beginPath();
              ctx.arc(orb.x, orb.y, Math.max(2.5, lineWidth * 0.42), 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.restore();
        },

        drawGear(ctx, cx, cy, r, teeth, angle, color, alpha = 1) {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(cx, cy);
          ctx.rotate(angle);
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.shadowColor = color;
          ctx.shadowBlur = 14;

          ctx.beginPath();
          const outerR = r + 10;
          const innerR = r - 4;
          for (let i = 0; i < teeth; i++) {
            const a0 = (i / teeth) * Math.PI * 2;
            const a1 = ((i + 0.25) / teeth) * Math.PI * 2;
            const a2 = ((i + 0.55) / teeth) * Math.PI * 2;
            const a3 = ((i + 0.8) / teeth) * Math.PI * 2;
            if (i === 0) ctx.moveTo(Math.cos(a0) * innerR, Math.sin(a0) * innerR);
            else ctx.lineTo(Math.cos(a0) * innerR, Math.sin(a0) * innerR);
            ctx.lineTo(Math.cos(a1) * outerR, Math.sin(a1) * outerR);
            ctx.lineTo(Math.cos(a2) * outerR, Math.sin(a2) * outerR);
            ctx.lineTo(Math.cos(a3) * innerR, Math.sin(a3) * innerR);
          }
          ctx.closePath();
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, r * 0.48, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(248, 250, 252, 0.35)';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        },
      };

      // =========================================================================
      // 3. 三语国际学校配置 (en 默认 | zh 简体中文 | th ภาษาไทย)
      // =========================================================================

        return 'en';

                  tip: '💡 สรุปท้ายคาบ: รับรู้ → วางแผน → จำ → ใช้เครื่องมือ → ทบทวน คือหัวใจของ AI Agent ตัวจริง',

      // =========================================================================
      // 4. 三大课程的 60fps 程序化矢量渲染函数 (纯时间 t 驱动，支持任意拖拽)
      // =========================================================================

      /** 第 1 课渲染：Tokenizer 切割机 + 4 维天平 + 向量魔法算式 */
      function renderLesson1(ctx, t) {
        const c1 = (CANVAS_I18N[state.lang] || CANVAS_I18N.en).l1;
        Draw.drawGridBg(ctx);

        let badge = c1.badge1;
        let badgeColor = '#38BDF8';
        if (t >= 4.8 && t < 9.8) {
          badge = c1.badge2;
          badgeColor = '#FBBF24';
        } else if (t >= 9.8) {
          badge = c1.badge3;
          badgeColor = '#F472B6';
        }
        Draw.drawStageHeader(ctx, c1.headerTitle, badge, badgeColor);

        // ----- 阶段 1 (0s - 4.8s): Tokenizer 激光切割机 -----
        const step1FadeOut = 1 - MathUtils.segment(t, 4.5, 5.1, MathUtils.easeInOutCubic);
        if (step1FadeOut > 0.01) {
          ctx.save();
          ctx.globalAlpha = step1FadeOut;
          const cy = 385;

          // 工业切割机腔体与传送带轨道
          Draw.drawCard(ctx, STAGE_W / 2, cy, c1.chamberW, 260, {
            fill: 'rgba(15, 23, 42, 0.92)',
            stroke: '#334155',
            lineWidth: 2.5,
            radius: 22,
          });
          ctx.fillStyle = '#64748B';
          ctx.font = `700 13px ${FONT_MONO}`;
          ctx.textAlign = 'center';
          ctx.fillText(c1.chamberLabel, STAGE_W / 2, cy - 102);

          // 传送带流光虚线
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
          ctx.lineWidth = 2;
          ctx.setLineDash([12, 10]);
          ctx.lineDashOffset = -t * 45;
          ctx.beginPath();
          ctx.moveTo(190, cy + 88);
          ctx.lineTo(1090, cy + 88);
          ctx.stroke();
          ctx.setLineDash([]);

          // 原句胶囊滑入 (0.0 -> 1.1s)
          const slideIn = MathUtils.segment(t, 0.0, 1.1, MathUtils.easeOutCubic);
          const rawX = MathUtils.lerp(-260, STAGE_W / 2, slideIn);
          const rawAlpha = 1 - MathUtils.segment(t, 2.3, 2.75);
          if (rawAlpha > 0.01) {
            Draw.drawCard(ctx, rawX, cy, 560, 92, {
              fill: '#1E293B',
              stroke: '#38BDF8',
              lineWidth: 2.5,
              radius: 16,
              glow: 14,
              alpha: rawAlpha,
            });
            ctx.save();
            ctx.globalAlpha = rawAlpha * step1FadeOut;
            ctx.fillStyle = '#F8FAFC';
            Draw.fitFont(ctx, c1.rawSentence, 500, 34, 20, '700', FONT_SANS);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(c1.rawSentence, rawX, cy);
            ctx.restore();
          }

          // 激光切割束扫过 (1.15 -> 2.45s)
          const laserProg = MathUtils.segment(t, 1.15, 2.45, MathUtils.easeInOutCubic);
          if (t >= 1.1 && t <= 2.65) {
            const laserAlpha =
              MathUtils.segment(t, 1.1, 1.25) * (1 - MathUtils.segment(t, 2.42, 2.65));
            const lx = MathUtils.lerp(330, 950, laserProg);
            ctx.save();
            ctx.globalAlpha = laserAlpha * step1FadeOut;
            ctx.strokeStyle = '#22D3EE';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#22D3EE';
            ctx.shadowBlur = 24;
            ctx.beginPath();
            ctx.moveTo(lx, cy - 82);
            ctx.lineTo(lx, cy + 82);
            ctx.stroke();

            // 切割火花粒子
            for (let s = 0; s < 6; s++) {
              const ang = t * 18 + s * 1.1;
              const dist = 12 + ((t * 90 + s * 17) % 28);
              ctx.fillStyle = s % 2 === 0 ? '#FBBF24' : '#38BDF8';
              ctx.beginPath();
              ctx.arc(lx + Math.cos(ang) * dist, cy + Math.sin(ang) * (dist * 0.8), 2.5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }

          // 切分后弹出的彩色 Token 乐高积木 (2.4 -> 4.6s，支持 4 块或 5 块自适应)
          const cardW = c1.cardW;
          const studW = Math.round(cardW * 0.19);
          const studGap = Math.round(cardW * 0.08);
          const badgeW = Math.round(cardW * 0.64);
          c1.tokens.forEach((tok, idx) => {
            const delay = 2.38 + idx * 0.14;
            const popT = MathUtils.segment(t, delay, delay + 0.72);
            if (popT <= 0.01) return;
            const springScale = MathUtils.spring(popT, 240, 15);
            const yOffset = MathUtils.lerp(0, Math.sin(t * 2.4 + idx) * 5, MathUtils.clamp01((t - 3.3) / 0.8));

            ctx.save();
            ctx.globalAlpha = step1FadeOut * Math.min(1, popT * 3);
            ctx.translate(tok.x, cy + yOffset);
            ctx.scale(springScale, springScale);

            // 乐高顶部凸点装饰
            ctx.fillStyle = tok.color;
            Draw.roundRectPath(ctx, -studGap - studW, -64, studW, 12, 4);
            ctx.fill();
            Draw.roundRectPath(ctx, studGap, -64, studW, 12, 4);
            ctx.fill();

            // 积木主体
            Draw.drawCard(ctx, 0, 0, cardW, 108, {
              fill: '#0F172A',
              stroke: tok.color,
              lineWidth: 3,
              radius: 15,
              glow: 16,
            });
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#F8FAFC';
            Draw.fitFont(ctx, tok.text, cardW - 22, 28, 16, '700', FONT_SANS);
            ctx.fillText(tok.text, 0, -14);

            // ID 徽章
            Draw.roundRectPath(ctx, -badgeW / 2, 14, badgeW, 26, 8);
            ctx.fillStyle = tok.color + '30';
            ctx.fill();
            ctx.fillStyle = tok.color;
            ctx.font = `700 13px ${FONT_MONO}`;
            ctx.fillText(`ID ${tok.id}`, 0, 27);
            ctx.restore();
          });

          ctx.restore();
        }

        // ----- 阶段 2 (4.8s - 9.8s): 4 维属性天平 -----
        const step2Fade =
          MathUtils.segment(t, 4.75, 5.3, MathUtils.easeOutCubic) *
          (1 - MathUtils.segment(t, 9.5, 10.05, MathUtils.easeInOutCubic));
        if (step2Fade > 0.01) {
          ctx.save();
          ctx.globalAlpha = step2Fade;

          // 外框架
          Draw.drawCard(ctx, STAGE_W / 2, 405, 1060, 445, {
            fill: 'rgba(13, 20, 36, 0.94)',
            stroke: '#334155',
            lineWidth: 2,
            radius: 22,
          });

          // 图例指示
          ctx.textAlign = 'center';
          Draw.fitFont(ctx, c1.dimHeader, 980, 17, 13, '600', FONT_SANS);
          ctx.fillStyle = '#CBD5E1';
          ctx.fillText(c1.dimHeader, STAGE_W / 2, 218);

          const legends = [
            {name: c1.legends[0], color: '#38BDF8', x: 445},
            {name: c1.legends[1], color: '#FBBF24', x: 635},
            {name: c1.legends[2], color: '#F472B6', x: 825},
          ];
          legends.forEach((lg) => {
            ctx.fillStyle = lg.color;
            Draw.roundRectPath(ctx, lg.x - 42, 240, 14, 14, 4);
            ctx.fill();
            ctx.textAlign = 'left';
            ctx.font = `700 15px ${FONT_SANS}`;
            ctx.fillText(lg.name, lg.x - 20, 252);
          });

          // 顶部装饰物理天平
          const balanceProgress = MathUtils.segment(t, 5.2, 7.6);
          const tiltAngle = Math.sin(balanceProgress * Math.PI * 3) * (1 - balanceProgress) * 0.14;
          ctx.save();
          ctx.translate(STAGE_W / 2, 294);
          ctx.strokeStyle = '#64748B';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, 20);
          ctx.lineTo(0, 0);
          ctx.stroke();
          ctx.rotate(tiltAngle);
          ctx.strokeStyle = '#94A3B8';
          ctx.beginPath();
          ctx.moveTo(-120, 0);
          ctx.lineTo(120, 0);
          ctx.stroke();
          ctx.fillStyle = '#FBBF24';
          ctx.beginPath();
          ctx.arc(-120, 0, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#F472B6';
          ctx.beginPath();
          ctx.arc(120, 0, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // 4 根特征柱组
          const dims = [
            {label: c1.dimLabels[0], ai: 0.96, king: 0.12, queen: 0.14, color: '#38BDF8', x: 295},
            {label: c1.dimLabels[1], ai: 0.18, king: 0.88, queen: 0.89, color: '#34D399', x: 525},
            {label: c1.dimLabels[2], ai: 0.06, king: 0.95, queen: 0.94, color: '#FBBF24', x: 755},
            {label: c1.dimLabels[3], ai: 0.50, king: 0.08, queen: 0.93, color: '#F472B6', x: 985},
          ];

          dims.forEach((dim, i) => {
            const grow = MathUtils.segment(t, 5.2 + i * 0.28, 6.4 + i * 0.28, MathUtils.easeOutBack);
            const barBaseY = 560;
            const maxH = 215;

            // 底槽背板
            Draw.roundRectPath(ctx, dim.x - 78, barBaseY - maxH - 12, 156, maxH + 20, 12);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.55)';
            ctx.fill();

            const items = [
              {val: dim.ai, color: '#38BDF8', dx: -44},
              {val: dim.king, color: '#FBBF24', dx: 0},
              {val: dim.queen, color: '#F472B6', dx: 44},
            ];

            items.forEach((it) => {
              const h = Math.max(4, it.val * maxH * Math.max(0, grow));
              const bx = dim.x + it.dx - 16;
              const by = barBaseY - h;

              ctx.save();
              ctx.fillStyle = it.color;
              ctx.shadowColor = it.color;
              ctx.shadowBlur = 10;
              Draw.roundRectPath(ctx, bx, by, 32, h, 6);
              ctx.fill();
              ctx.restore();

              if (grow > 0.35) {
                ctx.fillStyle = '#E2E8F0';
                ctx.font = `700 12px ${FONT_MONO}`;
                ctx.textAlign = 'center';
                ctx.fillText((it.val * Math.min(1, grow)).toFixed(2), dim.x + it.dx, by - 9);
              }
            });

            ctx.fillStyle = dim.color;
            Draw.fitFont(ctx, dim.label, 175, 17, 13, '700', FONT_SANS);
            ctx.textAlign = 'center';
            ctx.fillText(dim.label, dim.x, barBaseY + 26);
          });

          ctx.restore();
        }

        // ----- 阶段 3 (9.8s - 15.0s): 向量魔法算式 -----
        const step3Fade = MathUtils.segment(t, 9.7, 10.25, MathUtils.easeOutCubic);
        if (step3Fade > 0.01) {
          ctx.save();
          ctx.globalAlpha = step3Fade;

          Draw.drawCard(ctx, STAGE_W / 2, 412, 1060, 460, {
            fill: 'rgba(13, 20, 36, 0.95)',
            stroke: '#334155',
            lineWidth: 2,
            radius: 22,
          });

          // 坐标区裁剪与子网格
          const origin = {x: 340, y: 555};
          ctx.save();
          ctx.strokeStyle = 'rgba(51, 65, 85, 0.45)';
          ctx.lineWidth = 1;
          for (let gx = 180; gx <= 1080; gx += 45) {
            ctx.beginPath();
            ctx.moveTo(gx, 210);
            ctx.lineTo(gx, 585);
            ctx.stroke();
          }
          for (let gy = 225; gy <= 585; gy += 45) {
            ctx.beginPath();
            ctx.moveTo(180, gy);
            ctx.lineTo(1080, gy);
            ctx.stroke();
          }
          ctx.restore();

          // 主坐标轴
          Draw.drawArrow(ctx, 220, origin.y, 1060, origin.y, 1, {
            color: '#64748B',
            lineWidth: 2,
            headSize: 10,
            glow: 0,
          });
          Draw.drawArrow(ctx, origin.x, 585, origin.x, 220, 1, {
            color: '#64748B',
            lineWidth: 2,
            headSize: 10,
            glow: 0,
          });
          ctx.fillStyle = '#94A3B8';
          ctx.font = `600 14px ${FONT_SANS}`;
          ctx.textAlign = 'right';
          ctx.fillText(c1.axisX, 1055, origin.y + 24);
          ctx.textAlign = 'left';
          ctx.fillText(c1.axisY, origin.x + 14, 232);

          // 原点标记
          ctx.fillStyle = '#CBD5E1';
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = `600 13px ${FONT_MONO}`;
          ctx.textAlign = 'right';
          ctx.fillText(c1.originLabel, origin.x - 14, origin.y + 22);

          // 向量关键坐标点
          const pKing = {x: 610, y: 280};
          const pAfterMinusMan = {x: 745, y: 365};
          const pQueen = {x: 915, y: 265};

          // 1) [国王] 向量 (10.2 -> 11.4s)
          const p1 = MathUtils.segment(t, 10.2, 11.4, MathUtils.easeInOutCubic);
          Draw.drawArrow(ctx, origin.x, origin.y, pKing.x, pKing.y, p1, {
            color: '#FBBF24',
            lineWidth: 5,
            headSize: 14,
            label: c1.vecKingArrow,
            labelOffset: {x: -36, y: -18},
          });
          if (p1 > 0.9) {
            Draw.drawCard(ctx, pKing.x, pKing.y - 26, 98, 30, {
              fill: '#451A03',
              stroke: '#FBBF24',
              radius: 8,
            });
            ctx.fillStyle = '#FBBF24';
            ctx.font = `700 15px ${FONT_SANS}`;
            ctx.textAlign = 'center';
            ctx.fillText(c1.vecKingTag, pKing.x, pKing.y - 21);
          }

          // 2) - [男人] 向量 (11.5 -> 12.6s)
          const p2 = MathUtils.segment(t, 11.5, 12.6, MathUtils.easeInOutCubic);
          Draw.drawArrow(ctx, pKing.x, pKing.y, pAfterMinusMan.x, pAfterMinusMan.y, p2, {
            color: '#38BDF8',
            lineWidth: 4,
            dash: [10, 7],
            headSize: 13,
            label: c1.vecManArrow,
            labelOffset: {x: 66, y: -14},
          });

          // 3) + [女人] 向量 (12.7 -> 13.8s)
          const p3 = MathUtils.segment(t, 12.7, 13.8, MathUtils.easeInOutCubic);
          Draw.drawArrow(ctx, pAfterMinusMan.x, pAfterMinusMan.y, pQueen.x, pQueen.y, p3, {
            color: '#F472B6',
            lineWidth: 5,
            headSize: 14,
            label: c1.vecWomanArrow,
            labelOffset: {x: 62, y: 18},
          });

          // 4) 命中 [女王] 落点星标脉冲 (13.8 -> 15.0s)
          const pHit = MathUtils.segment(t, 13.75, 14.45);
          if (pHit > 0.01) {
            const hitScale = MathUtils.spring(pHit, 220, 14);
            // 原点到女王的最终合成虚线对照向量
            Draw.drawArrow(ctx, origin.x, origin.y, pQueen.x, pQueen.y, pHit, {
              color: 'rgba(244, 114, 182, 0.45)',
              lineWidth: 2.5,
              dash: [6, 6],
              headSize: 11,
              glow: 0,
            });

            ctx.save();
            ctx.translate(pQueen.x, pQueen.y);
            const ringR = 16 + ((t * 26) % 28);
            ctx.strokeStyle = `rgba(244, 114, 182, ${1 - ((t * 26) % 28) / 28})`;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 0, ringR, 0, Math.PI * 2);
            ctx.stroke();

            ctx.scale(hitScale, hitScale);
            ctx.fillStyle = '#F472B6';
            ctx.shadowColor = '#F472B6';
            ctx.shadowBlur = 22;
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#FDF2F8';
            ctx.lineWidth = 3;
            ctx.stroke();

            Draw.drawCard(ctx, 0, -40, 148, 34, {
              fill: '#500724',
              stroke: '#F472B6',
              radius: 10,
              glow: 16,
            });
            ctx.fillStyle = '#FDF2F8';
            ctx.font = `700 16px ${FONT_SANS}`;
            ctx.textAlign = 'center';
            ctx.fillText(c1.vecQueenTag, 0, -34);
            ctx.restore();

            // 魔法公式条
            ctx.font = `700 16px ${FONT_MONO}`;
            const formulaW = Math.min(980, Math.max(660, Draw.measureWidth(ctx, c1.formulaBar) + 70));
            Draw.drawCard(ctx, STAGE_W / 2, 612, formulaW, 44, {

      /** 第 2 课渲染：Self-Attention 探照灯对比与 Q-K-V 锁钥匹配 */
      function renderLesson2(ctx, t) {
        const c2 = (CANVAS_I18N[state.lang] || CANVAS_I18N.en).l2;
        Draw.drawGridBg(ctx);

        const isScenarioB = t >= 9.6;
        let badge = c2.badge1;
        let badgeColor = '#A78BFA';
        if (t >= 4.8 && t < 9.6) {
          badge = c2.badge2;
          badgeColor = '#FBBF24';
        } else if (isScenarioB) {
          badge = c2.badge3;
          badgeColor = '#22D3EE';
        }
        Draw.drawStageHeader(ctx, c2.headerTitle, badge, badgeColor);

        // 计算动画关键插值
        const beamAppear = MathUtils.segment(t, 1.0, 2.3, MathUtils.easeInOutCubic);
        const focusA = MathUtils.segment(t, 4.6, 5.7, MathUtils.easeInOutCubic);
        const switchB = MathUtils.segment(t, 9.6, 10.7, MathUtils.easeInOutCubic);

        // 当前权重值实时平滑插值
        const dogWeight = MathUtils.lerp(
          MathUtils.lerp(0.22, 0.88, focusA),
          0.08,
          switchB
        );
        const boneWeight = MathUtils.lerp(
          MathUtils.lerp(0.18, 0.12, focusA),
          0.92,
          switchB
        );

        const words = c2.words;
        const dogWord = words.find((w) => w.role === 'dog') || words[0];
        const boneWord = words.find((w) => w.role === 'bone') || words[1];
        const itWord = words.find((w) => w.role === 'it') || words[words.length - 2];
        const midWords = words.filter((w) => w.role === 'mid');
        const wordY = 330;

        // 1. 绘制从 [it] 射向各个词的贝塞尔探照灯光束
        const itOrigin = {x: itWord.x, y: wordY - 46};

        // 弱背景关联线
        if (beamAppear > 0.05) {
          midWords.forEach((mw) => {
            Draw.drawAttentionBeam(
              ctx,
              itOrigin,
              {x: (itOrigin.x + mw.x) / 2, y: 215},
              {x: (itOrigin.x + mw.x) / 2, y: 215},
              {x: mw.x, y: wordY - 42},
              beamAppear,
              {color: 'rgba(148, 163, 184, 0.25)', lineWidth: 2, alpha: 0.45, showParticles: false}
            );
          });
        }

        // 射向 dog 的光束
        const dogCp1 = {x: MathUtils.lerp(itOrigin.x, dogWord.x, 0.25), y: 135};
        const dogCp2 = {x: MathUtils.lerp(itOrigin.x, dogWord.x, 0.75), y: 135};
        const dogEnd = {x: dogWord.x, y: wordY - 48};
        Draw.drawAttentionBeam(ctx, itOrigin, dogCp1, dogCp2, dogEnd, beamAppear, {
          color: '#FBBF24',
          lineWidth: 2 + dogWeight * 14,
          alpha: 0.25 + dogWeight * 0.75,
          time: t,
          showParticles: dogWeight > 0.4,
        });

        // 射向 bone 的光束
        const boneCp1 = {x: MathUtils.lerp(itOrigin.x, boneWord.x, 0.25), y: 180};
        const boneCp2 = {x: MathUtils.lerp(itOrigin.x, boneWord.x, 0.75), y: 180};
        const boneEnd = {x: boneWord.x, y: wordY - 48};
        Draw.drawAttentionBeam(ctx, itOrigin, boneCp1, boneCp2, boneEnd, beamAppear, {
          color: '#22D3EE',
          lineWidth: 2 + boneWeight * 14,
          alpha: 0.25 + boneWeight * 0.75,
          time: t,
          showParticles: boneWeight > 0.4,
        });

        // 光束权重悬浮标签
        if (beamAppear > 0.6) {
          const dogPct = Math.round(dogWeight * 100);
          const bonePct = Math.round(boneWeight * 100);
          const dogMid = Draw.cubicPoint(itOrigin, dogCp1, dogCp2, dogEnd, 0.55);
          const boneMid = Draw.cubicPoint(itOrigin, boneCp1, boneCp2, boneEnd, 0.52);
          ctx.save();
          ctx.textAlign = 'center';
          ctx.font = `800 16px ${FONT_MONO}`;
          ctx.fillStyle = '#FBBF24';
          ctx.fillText(`${dogPct}%`, dogMid.x, dogMid.y - 16);
          ctx.fillStyle = '#22D3EE';
          ctx.fillText(`${bonePct}%`, boneMid.x, boneMid.y - 14);
          ctx.restore();
        }

        // 2. 绘制词元卡片
        words.forEach((item) => {
          let stroke = '#334155';
          let fill = '#0F172A';
          let glow = 0;
          let scale = 1;
          let displayWord = item.text;

          if (item.role === 'dog') {
            if (dogWeight > 0.45) {
              stroke = '#FBBF24';
              fill = '#231A09';
              glow = 20 * dogWeight;
              scale = 1 + 0.08 * dogWeight;
            }
          } else if (item.role === 'bone') {
            if (boneWeight > 0.45) {
              stroke = '#22D3EE';
              fill = '#082636';
              glow = 22 * boneWeight;
              scale = 1 + 0.08 * boneWeight;
            }
          } else if (item.role === 'it') {
            stroke = '#A78BFA';
            fill = '#1E1B4B';
            glow = 18;
          } else if (item.role === 'tail') {
            const flipScaleX = switchB > 0 && switchB < 1 ? Math.abs(Math.cos(switchB * Math.PI)) : 1;
            scale = flipScaleX;
            displayWord = switchB >= 0.5 ? c2.tailB : c2.tailA;
            stroke = switchB >= 0.5 ? '#22D3EE' : '#F472B6';
            fill = switchB >= 0.5 ? '#082F49' : '#31102A';
            glow = 14;
          }

          ctx.save();
          ctx.translate(item.x, wordY);
          if (item.role === 'tail') {
            ctx.scale(scale, 1);
          } else {
            ctx.scale(scale, scale);
          }

          Draw.drawCard(ctx, 0, 0, item.w, 86, {
            fill,
            stroke,
            lineWidth: glow > 0 ? 3 : 2,
            radius: 15,
            glow,
          });
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = item.role === 'mid' ? '#94A3B8' : '#F8FAFC';
          Draw.fitFont(ctx, displayWord, item.w - 14, 24, 15, '700', FONT_SANS);
          ctx.fillText(displayWord, 0, -10);

          ctx.fillStyle =
            item.role === 'dog'
              ? '#FBBF24'
              : item.role === 'bone'
                ? '#22D3EE'
                : item.role === 'it'
                  ? '#C4B5FD'
                  : '#64748B';
          Draw.fitFont(ctx, item.key, item.w - 10, 11.5, 9, '600', FONT_MONO);
          ctx.fillText(item.key, 0, 24);
          ctx.restore();
        });

        // 3. Q-K-V 锁钥匹配飞行动画
        const keyFly = MathUtils.segment(t, 1.4, 4.2, MathUtils.easeInOutCubic);
        if (t >= 1.3 && t <= 4.7) {
          const flyAlpha = 1 - MathUtils.segment(t, 4.2, 4.7);
          const kx = MathUtils.lerp(itWord.x, dogWord.x, keyFly);
          const ky = wordY + 58;
          ctx.save();
          ctx.globalAlpha = flyAlpha;
          Draw.drawCard(ctx, kx, ky, 210, 32, {
            fill: '#312E81',
            stroke: '#A78BFA',
            radius: 10,
            glow: 12,
          });
          ctx.fillStyle = '#F8FAFC';
          const keyLabel = keyFly > 0.8 ? c2.keyMatched : c2.keySearching;
          Draw.fitFont(ctx, keyLabel, 192, 13, 10.5, '700', FONT_SANS);
          ctx.textAlign = 'center';
          ctx.fillText(keyLabel, kx, ky + 4);
          ctx.restore();
        }

        // 4. 底部词元连线强度条仪表盘 + 双句对比卡片
        Draw.drawCard(ctx, STAGE_W / 2, 515, 1080, 148, {
          fill: 'rgba(13, 20, 36, 0.94)',
          stroke: '#334155',
          radius: 18,
        });

        ctx.textAlign = 'left';
        ctx.font = `700 15px ${FONT_SANS}`;
        ctx.fillStyle = '#CBD5E1';
        ctx.fillText(c2.dashTitle, 128, 466);

        // 指向 dog 进度条
        ctx.fillStyle = '#FBBF24';
        Draw.fitFont(ctx, c2.dogRowLabel, 138, 16, 12, '700', FONT_SANS);
        ctx.fillText(c2.dogRowLabel, 128, 505);
        Draw.roundRectPath(ctx, 278, 492, 560, 22, 11);
        ctx.fillStyle = '#1E293B';
        ctx.fill();
        Draw.roundRectPath(ctx, 278, 492, Math.max(18, 560 * dogWeight), 22, 11);
        ctx.fillStyle = '#FBBF24';
        ctx.fill();
        ctx.font = `700 18px ${FONT_MONO}`;
        ctx.fillText(`${Math.round(dogWeight * 100)}%`, 854, 508);

        // 指向 bone 进度条
        ctx.fillStyle = '#22D3EE';
        Draw.fitFont(ctx, c2.boneRowLabel, 138, 16, 12, '700', FONT_SANS);
        ctx.fillText(c2.boneRowLabel, 128, 548);
        Draw.roundRectPath(ctx, 278, 535, 560, 22, 11);
        ctx.fillStyle = '#1E293B';
        ctx.fill();
        Draw.roundRectPath(ctx, 278, 535, Math.max(18, 560 * boneWeight), 22, 11);
        ctx.fillStyle = '#22D3EE';
        ctx.fill();
        ctx.font = `700 18px ${FONT_MONO}`;
        ctx.fillText(`${Math.round(boneWeight * 100)}%`, 854, 551);

        // 情景对比缩略徽章
        Draw.drawCard(ctx, 1046, 504, 214, 36, {
          fill: !isScenarioB ? 'rgba(251, 191, 36, 0.2)' : '#1E293B',
          stroke: !isScenarioB ? '#FBBF24' : '#475569',
          radius: 9,
        });
        ctx.textAlign = 'center';
        Draw.fitFont(ctx, c2.badgeA, 196, 13, 10.5, '700', FONT_SANS);
        ctx.fillStyle = !isScenarioB ? '#FBBF24' : '#94A3B8';
        ctx.fillText(c2.badgeA, 1046, 509);

        Draw.drawCard(ctx, 1046, 548, 214, 36, {
          fill: isScenarioB ? 'rgba(34, 211, 238, 0.2)' : '#1E293B',
          stroke: isScenarioB ? '#22D3EE' : '#475569',
          radius: 9,
        });
        Draw.fitFont(ctx, c2.badgeB, 196, 13, 10.5, '700', FONT_SANS);
        ctx.fillStyle = isScenarioB ? '#22D3EE' : '#94A3B8';
        ctx.fillText(c2.badgeB, 1046, 553);

        // 底部 QKV 公式阐释条
        Draw.drawCard(ctx, STAGE_W / 2, 624, 1080, 46, {
          fill: '#1E293B',
          stroke: isScenarioB ? '#22D3EE' : '#818CF8',
          radius: 12,
        });
        ctx.fillStyle = '#E2E8F0';
        const qkvSummary = isScenarioB ? c2.qkvB : c2.qkvA;
        Draw.fitFont(ctx, qkvSummary, 1030, 15, 11.5, '600', FONT_SANS);
        ctx.textAlign = 'center';
        ctx.fillText(qkvSummary, STAGE_W / 2, 629);
      }

      /** 第 3 课渲染：AI Agent 钢铁侠战甲闭环 */
      function renderLesson3(ctx, t) {

          badge = c3.badge3;
          badgeColor = '#A78BFA';

          badge = c3.badge4;
          badgeColor = '#34D399';

        Draw.drawStageHeader(ctx, c3.headerTitle, badge, badgeColor);

        // 顶部用户任务卡

        const p4 = MathUtils.segment(t, 12.1, 13.7, MathUtils.easeInOutCubic);
        const pOut = MathUtils.segment(t, 13.8, 15.1, MathUtils.easeOutCubic);

        // 四个外设节点坐标 (卡片宽 316)
        const cardW = 316;
        const nodes = {

        // 连接脉冲线
        Draw.drawArrow(ctx, core.x - 95, core.y - 35, nodes.weather.x + cardW / 2 + 6, nodes.weather.y, p1, {
          color: '#38BDF8',
          lineWidth: 4,
          label: c3.arrowWeather,
          labelOffset: {x: 0, y: -16},
        });

        Draw.drawArrow(ctx, nodes.reflect.x + cardW / 2 + 6, nodes.reflect.y, core.x - 95, core.y + 35, p2, {

        Draw.drawGear(ctx, core.x, core.y, 92, 14, gearAngle, '#38BDF8', 0.85);

        ctx.save();
        ctx.translate(core.x, core.y);
        ctx.fillStyle = '#0B1120';
        ctx.strokeStyle = badgeColor;
        ctx.lineWidth = 3.5;
        ctx.shadowColor = badgeColor;
        ctx.shadowBlur = 24;

        ctx.arc(0, 0, 56, 0, Math.PI * 2);

        ctx.shadowBlur = 0;

        ctx.restore();

        // 工具 1：天气 API 机械臂
        const wActive = t >= 1.6;
        const wScale = wActive ? MathUtils.spring(MathUtils.segment(t, 1.6, 2.5), 220, 15) : 1;
        Draw.drawCard(ctx, nodes.weather.x, nodes.weather.y, cardW, 108, {
          fill: wActive ? '#082F49' : '#0F172A',
          stroke: wActive ? '#38BDF8' : '#334155',
          lineWidth: wActive ? 3 : 2,
          glow: wActive ? 18 : 0,
          alpha: wActive ? 1 : 0.45,
          scale: wScale,
        });
        ctx.save();
        ctx.globalAlpha = wActive ? 1 : 0.5;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#38BDF8';
        Draw.fitFont(ctx, c3.weatherTitle, cardW - 24, 17, 13, '700', FONT_SANS);
        ctx.fillText(c3.weatherTitle, nodes.weather.x, nodes.weather.y - 22);
        ctx.fillStyle = '#E2E8F0';
        const wMsg = wActive ? c3.weatherLine1 : c3.weatherWait;
        Draw.fitFont(ctx, wMsg, cardW - 24, 14, 11, '600', FONT_SANS);
        ctx.fillText(wMsg, nodes.weather.x, nodes.weather.y + 6);
        if (wActive) {

          Draw.fitFont(ctx, c3.weatherLine2, cardW - 24, 14, 11, '700', FONT_SANS);
          ctx.fillText(c3.weatherLine2, nodes.weather.x, nodes.weather.y + 30);
        }

        Draw.drawCard(ctx, nodes.reflect.x, nodes.reflect.y, cardW, 108, {
          fill: rActive ? '#431407' : '#0F172A',
          stroke: rActive ? '#FB923C' : '#334155',
          lineWidth: rActive ? 3 : 2,
          glow: rActive ? 16 + alarmPulse * 14 : 0,
          alpha: rActive ? 1 : 0.4,

          ctx.fillText(c3.finalLine1, STAGE_W / 2, 606);
          ctx.fillStyle = '#A7F3D0';
          Draw.fitFont(ctx, c3.finalLine2, 1070, 13, 10.5, '600', FONT_MONO);
          ctx.fillText(c3.finalLine2, STAGE_W / 2, 642);
          ctx.restore();
        }
      }

      // =========================================================================
      // 5. 播放器与交互控制器 (支持 EN / ZH / TH 三语同步与 postMessage)
      // =========================================================================
      const state = {
        lang: resolveInitialLang(),
        lessonIndex: 0,
        mode: 'ppt', // 'ppt' | 'anim'
        pptSlideIndex: 0,
        currentTime: 0,
        isPlaying: false,
        speed: 1,
        notesOpen: true,
        isDragging: false,
        lastFrameTs: 0,
      };

      const el = {
        appShell: document.getElementById('appShell'),
        brandTitle: document.getElementById('brandTitle'),
        brandBadgeText: document.getElementById('brandBadgeText'),
        lessonTabs: document.getElementById('lessonTabs'),
        langSwitch: document.getElementById('langSwitch'),
        modeSwitch: document.getElementById('modeSwitch'),
        btnModePpt: document.getElementById('btnModePpt'),
        btnModeAnim: document.getElementById('btnModeAnim'),
        btnFullscreen: document.getElementById('btnFullscreen'),
        pptView: document.getElementById('pptView'),
        canvasView: document.getElementById('canvasView'),
        pptTag: document.getElementById('pptTag'),
        pptTitle: document.getElementById('pptTitle'),
        pptSubtitle: document.getElementById('pptSubtitle'),
        pptPageIndicator: document.getElementById('pptPageIndicator'),
        pptConceptHeading: document.getElementById('pptConceptHeading'),
        pptPoints: document.getElementById('pptPoints'),
        pptEmoji: document.getElementById('pptEmoji'),
        pptMetaphorTitle: document.getElementById('pptMetaphorTitle'),
        pptMetaphorDesc: document.getElementById('pptMetaphorDesc'),
        pptFormula: document.getElementById('pptFormula'),
        btnPptPrev: document.getElementById('btnPptPrev'),
        btnPptNext: document.getElementById('btnPptNext'),
        btnEnterAnim: document.getElementById('btnEnterAnim'),
        btnEnterAnimText: document.getElementById('btnEnterAnimText'),
        btnBackToPpt: document.getElementById('btnBackToPpt'),
        stepPills: document.getElementById('stepPills'),
        canvasContainer: document.getElementById('canvasContainer'),
        animCanvas: document.getElementById('animCanvas'),
        btnStepPrev: document.getElementById('btnStepPrev'),
        btnPlayPause: document.getElementById('btnPlayPause'),
        btnStepNext: document.getElementById('btnStepNext'),
        btnReplay: document.getElementById('btnReplay'),
        scrubberTrack: document.getElementById('scrubberTrack'),
        scrubberRail: document.getElementById('scrubberRail'),
        scrubberFill: document.getElementById('scrubberFill'),
        scrubberThumb: document.getElementById('scrubberThumb'),
        keyframeMarkers: document.getElementById('keyframeMarkers'),
        timeDisplay: document.getElementById('timeDisplay'),
        stepStatusText: document.getElementById('stepStatusText'),
        speedGroup: document.getElementById('speedGroup'),
        btnToggleNotes: document.getElementById('btnToggleNotes'),
        notesDrawer: document.getElementById('notesDrawer'),
        notesHeading: document.getElementById('notesHeading'),
        notesStepTag: document.getElementById('notesStepTag'),
        notesBody: document.getElementById('notesBody'),
        notesTip: document.getElementById('notesTip'),
      };

      const ctx = el.animCanvas.getContext('2d');

      function getUi() {
        return UI_I18N[state.lang] || UI_I18N.en;
      }

      function getCurrentLesson() {
        return LESSONS[state.lessonIndex];
      }

      function getLessonContent(lesson = getCurrentLesson()) {
        return lesson.i18n[state.lang] || lesson.i18n.en;
      }

      function getLessonSteps(lesson = getCurrentLesson()) {
        const content = getLessonContent(lesson);
        return lesson.stepTimes.map((time, idx) => ({
          time,
          ...content.steps[idx],
        }));
      }

      function getActiveStepIndex() {
        const steps = getLessonSteps();
        let activeIdx = 0;
        for (let i = 0; i < steps.length; i++) {
          if (state.currentTime + 0.05 >= steps[i].time) activeIdx = i;
        }
        return activeIdx;
      }

      function applyLangUI() {
        const ui = getUi();
        document.documentElement.lang = ui.htmlLang;
        document.title = ui.docTitle;

        el.brandTitle.textContent = ui.brandTitle;
        el.brandBadgeText.textContent = ui.brandBadge;
        el.lessonTabs.setAttribute('aria-label', ui.lessonAria);
        el.modeSwitch.setAttribute('aria-label', ui.modeAria);
        el.btnModePpt.textContent = ui.modePpt;
        el.btnModeAnim.textContent = ui.modeAnim;
        el.btnFullscreen.textContent = ui.fullscreen;
        el.btnFullscreen.title = ui.fullscreenTitle;
        el.pptConceptHeading.textContent = ui.pptConceptHeading;
        el.btnPptPrev.textContent = ui.pptPrev;
        el.btnPptNext.textContent = ui.pptNext;
        el.btnEnterAnimText.textContent = ui.enterAnim;
        el.btnBackToPpt.textContent = ui.backToPpt;
        el.btnStepPrev.textContent = ui.stepPrev;
        el.btnStepPrev.title = ui.stepPrevTitle;
        el.btnPlayPause.title = ui.playTitle;
        el.btnStepNext.textContent = ui.stepNext;
        el.btnStepNext.title = ui.stepNextTitle;
        el.btnReplay.textContent = ui.replay;
        el.btnReplay.title = ui.replayTitle;
        el.speedGroup.title = ui.speedTitle;
        el.btnToggleNotes.textContent = ui.notesBtn;
        el.notesHeading.textContent = ui.notesHeading;

        el.lessonTabs.querySelectorAll('.lesson-tab').forEach((tab, idx) => {
          const content = getLessonContent(LESSONS[idx]);
          tab.textContent = content.tabTitle;
          tab.classList.toggle('active', idx === state.lessonIndex);
        });

        el.langSwitch.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.lang === state.lang);
        });
      }

      function setLang(lang, persist = true) {
        if (!LANGS.includes(lang)) return;
        state.lang = lang;
        if (persist) {
          try {
            localStorage.setItem('ai_course_lang', lang);
          } catch (_) {}
        }
        applyLangUI();
        renderPptSlide();
        renderStepPillsAndMarkers();
        syncUI();
        renderCanvasFrame();
      }

      /** HiDPI 等比缩放 Canvas，确保在任意屏占比下锐利呈现 */
      function resizeCanvas() {
        const rect = el.canvasContainer.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        el.animCanvas.width = Math.round(rect.width * dpr);
        el.animCanvas.height = Math.round(rect.height * dpr);

        const scale = Math.min(rect.width / STAGE_W, rect.height / STAGE_H);
        const offsetX = (rect.width - STAGE_W * scale) / 2;
        const offsetY = (rect.height - STAGE_H * scale) / 2;
        ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offsetX * dpr, offsetY * dpr);
      }

      function renderCanvasFrame() {
        if (!ctx) return;
        const rect = el.canvasContainer.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        // 清空整块物理画布背景
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#070B14';
        ctx.fillRect(0, 0, el.animCanvas.width, el.animCanvas.height);
        ctx.restore();

        // 逻辑坐标系下绘制当前课程帧
        const scale = Math.min(rect.width / STAGE_W, rect.height / STAGE_H);
        const offsetX = (rect.width - STAGE_W * scale) / 2;
        const offsetY = (rect.height - STAGE_H * scale) / 2;
        ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offsetX * dpr, offsetY * dpr);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, STAGE_W, STAGE_H);
        ctx.clip();
        getCurrentLesson().render(ctx, state.currentTime);
        ctx.restore();
      }

      function renderPptSlide() {
        const ui = getUi();
        const slides = getLessonContent().slides;
        const slide = slides[state.pptSlideIndex];
        el.pptTag.textContent = slide.tag;
        el.pptTitle.textContent = slide.title;
        el.pptSubtitle.textContent = slide.subtitle;
        el.pptPageIndicator.textContent = `${ui.pptSlideLabel} ${state.pptSlideIndex + 1} / ${slides.length}`;
        el.pptPoints.innerHTML = slide.points.map((pt) => `<li>${pt}</li>`).join('');
        el.pptEmoji.textContent = slide.emoji;
        el.pptMetaphorTitle.textContent = slide.metaphorTitle;
        el.pptMetaphorDesc.textContent = slide.metaphorDesc;
        el.pptFormula.textContent = slide.formula;

        el.btnPptPrev.disabled = state.pptSlideIndex === 0;
        el.btnPptNext.disabled = state.pptSlideIndex === slides.length - 1;
        el.btnPptPrev.style.opacity = el.btnPptPrev.disabled ? '0.45' : '1';
        el.btnPptNext.style.opacity = el.btnPptNext.disabled ? '0.45' : '1';
      }

      function renderStepPillsAndMarkers() {
        const lesson = getCurrentLesson();
        const steps = getLessonSteps(lesson);
        el.stepPills.innerHTML = steps
          .map((s, idx) => `<button class="step-pill" data-step="${idx}">${s.label}</button>`)
          .join('');
        el.keyframeMarkers.innerHTML = steps
          .map((s) => {
            const pct = (s.time / lesson.duration) * 100;
            return `<span class="keyframe-diamond" style="left:${pct}%" title="${s.label}"></span>`;
          })
          .join('');
      }

      function syncUI() {
        const ui = getUi();
        const lesson = getCurrentLesson();
        const content = getLessonContent(lesson);
        const steps = getLessonSteps(lesson);
        const pct = MathUtils.clamp01(state.currentTime / lesson.duration) * 100;
        el.scrubberFill.style.width = `${pct}%`;
        el.scrubberThumb.style.left = `${pct}%`;
        el.timeDisplay.textContent = `${state.currentTime.toFixed(1).padStart(4, '0')}s / ${lesson.duration.toFixed(1)}s`;

        const stepIdx = getActiveStepIndex();
        const activeStep = steps[stepIdx];
        el.stepStatusText.textContent = `${ui.stagePrefix} ${activeStep.label}`;

        // 同步 Step 胶囊高亮
        const pills = el.stepPills.querySelectorAll('.step-pill');
        pills.forEach((pill, i) => {
          pill.classList.toggle('active', i === stepIdx);
        });

        // 同步播放按钮
        el.btnPlayPause.textContent = state.isPlaying ? ui.pause : ui.play;

        // 同步模式显隐
        const isPpt = state.mode === 'ppt';
        el.pptView.classList.toggle('active', isPpt);
        el.canvasView.classList.toggle('active', !isPpt);
        el.btnModePpt.classList.toggle('active', isPpt);
        el.btnModeAnim.classList.toggle('active', !isPpt);

        // 同步提词器
        if (isPpt) {
          const slide = content.slides[state.pptSlideIndex];
          el.notesStepTag.textContent = `${ui.pptNotesTag} ${state.pptSlideIndex + 1}`;
          el.notesBody.textContent = `${ui.pptNotesPrefix} ${slide.title} — ${slide.metaphorDesc}`;
          el.notesTip.textContent = ui.pptNotesTip;
        } else {
          el.notesStepTag.textContent = activeStep.label;
          el.notesBody.textContent = activeStep.note;
          el.notesTip.textContent = activeStep.tip;
        }
      }

      function switchLesson(index) {
        state.lessonIndex = index;
        state.pptSlideIndex = 0;
        state.currentTime = 0;
        state.isPlaying = false;

        el.lessonTabs.querySelectorAll('.lesson-tab').forEach((tab, idx) => {
          tab.classList.toggle('active', idx === index);
        });
        renderPptSlide();
        renderStepPillsAndMarkers();
        syncUI();
        renderCanvasFrame();
      }

      function setMode(mode, autoPlay = false) {
        state.mode = mode;
        if (mode === 'anim') {
          resizeCanvas();
          if (autoPlay) {
            if (state.currentTime >= getCurrentLesson().duration - 0.1) {
              state.currentTime = 0;
            }
            state.isPlaying = true;
          }
        } else {
          state.isPlaying = false;
        }
        syncUI();
        if (mode === 'anim') renderCanvasFrame();
      }

      function stepTo(delta) {
        if (state.mode !== 'anim') setMode('anim', false);
        const steps = getLessonSteps();
        const curIdx = getActiveStepIndex();
        const targetIdx = Math.max(0, Math.min(steps.length - 1, curIdx + delta));
        state.currentTime = steps[targetIdx].time;
        state.isPlaying = false;
        syncUI();
        renderCanvasFrame();
      }

      // 主循环：60fps requestAnimationFrame 调度器
      function tick(ts) {
        if (!state.lastFrameTs) state.lastFrameTs = ts;
        const dt = Math.min(0.1, (ts - state.lastFrameTs) / 1000);
        state.lastFrameTs = ts;

        if (state.isPlaying && state.mode === 'anim' && !state.isDragging) {
          const duration = getCurrentLesson().duration;
          state.currentTime += dt * state.speed;
          if (state.currentTime >= duration) {
            state.currentTime = duration;
            state.isPlaying = false;
          }
          syncUI();
          renderCanvasFrame();
        }
        requestAnimationFrame(tick);
      }

      // 绑定事件监听器
      el.langSwitch.addEventListener('click', (e) => {
        const btn = e.target.closest('.lang-btn');
        if (!btn) return;
        setLang(btn.dataset.lang);
      });

      window.addEventListener('message', (e) => {
        if (e.data?.type === 'SET_LANG') setLang(e.data.lang);
      });

      el.lessonTabs.addEventListener('click', (e) => {
        const btn = e.target.closest('.lesson-tab');
        if (!btn) return;
        switchLesson(Number(btn.dataset.lesson));
      });

      el.btnModePpt.addEventListener('click', () => setMode('ppt'));
      el.btnModeAnim.addEventListener('click', () => setMode('anim', true));
      el.btnEnterAnim.addEventListener('click', () => setMode('anim', true));
      el.btnBackToPpt.addEventListener('click', () => setMode('ppt'));

      el.btnPptPrev.addEventListener('click', () => {
        if (state.pptSlideIndex > 0) {
          state.pptSlideIndex -= 1;
          renderPptSlide();
          syncUI();
        }
      });

      el.btnPptNext.addEventListener('click', () => {
        const max = getLessonContent().slides.length - 1;
        if (state.pptSlideIndex < max) {
          state.pptSlideIndex += 1;
          renderPptSlide();
          syncUI();
        }
      });

      el.stepPills.addEventListener('click', (e) => {
        const pill = e.target.closest('.step-pill');
        if (!pill) return;
        const idx = Number(pill.dataset.step);
        state.currentTime = getLessonSteps()[idx].time;
        state.isPlaying = true;
        syncUI();
        renderCanvasFrame();
      });

      el.btnPlayPause.addEventListener('click', () => {
        if (state.mode !== 'anim') {
          setMode('anim', true);
          return;
        }
        if (!state.isPlaying && state.currentTime >= getCurrentLesson().duration - 0.05) {
          state.currentTime = 0;
        }
        state.isPlaying = !state.isPlaying;
        syncUI();
      });

      el.btnReplay.addEventListener('click', () => {
        if (state.mode !== 'anim') setMode('anim', false);
        state.currentTime = 0;
        state.isPlaying = true;
        syncUI();
        renderCanvasFrame();
      });

      el.btnStepPrev.addEventListener('click', () => stepTo(-1));
      el.btnStepNext.addEventListener('click', () => stepTo(1));

      el.speedGroup.addEventListener('click', (e) => {
        const btn = e.target.closest('.speed-btn');
        if (!btn) return;
        state.speed = Number(btn.dataset.speed);
        el.speedGroup.querySelectorAll('.speed-btn').forEach((b) => {
          b.classList.toggle('active', b === btn);
        });
      });

      el.btnToggleNotes.addEventListener('click', () => {
        state.notesOpen = !state.notesOpen;
        el.notesDrawer.classList.toggle('open', state.notesOpen);
        setTimeout(() => {
          resizeCanvas();
          renderCanvasFrame();
        }, 300);
      });

      el.btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          el.appShell.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen?.().catch(() => {});
        }
      });

      // 时间轴进度条拖动 Scrubbing
      function scrubAtClientX(clientX) {
        const rect = el.scrubberRail.getBoundingClientRect();
        if (!rect.width) return;
        const ratio = MathUtils.clamp01((clientX - rect.left) / rect.width);
        if (state.mode !== 'anim') setMode('anim', false);
        state.currentTime = ratio * getCurrentLesson().duration;
        syncUI();
        renderCanvasFrame();
      }

      el.scrubberTrack.addEventListener('mousedown', (e) => {
        state.isDragging = true;
        scrubAtClientX(e.clientX);
      });
      window.addEventListener('mousemove', (e) => {
        if (state.isDragging) scrubAtClientX(e.clientX);
      });
      window.addEventListener('mouseup', () => {
        state.isDragging = false;
      });
      el.scrubberTrack.addEventListener('touchstart', (e) => {
        state.isDragging = true;
        if (e.touches[0]) scrubAtClientX(e.touches[0].clientX);
      }, {passive: true});
      window.addEventListener('touchmove', (e) => {
        if (state.isDragging && e.touches[0]) scrubAtClientX(e.touches[0].clientX);
      }, {passive: true});
      window.addEventListener('touchend', () => {
        state.isDragging = false;
      });

      // 键盘快捷键支持
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          el.btnPlayPause.click();
        } else if (e.code === 'ArrowLeft') {
          if (state.mode === 'ppt') el.btnPptPrev.click();
          else stepTo(-1);
        } else if (e.code === 'ArrowRight') {
          if (state.mode === 'ppt') el.btnPptNext.click();
          else stepTo(1);
        } else if (e.key === 'm' || e.key === 'M') {
          setMode(state.mode === 'ppt' ? 'anim' : 'ppt', state.mode === 'ppt');
        }
      });

      window.addEventListener('resize', () => {
        resizeCanvas();
        renderCanvasFrame();
      });

      // 启动初始化
      applyLangUI();
      switchLesson(0);
      resizeCanvas();
      renderCanvasFrame();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
